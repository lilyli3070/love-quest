<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE QUEST 💗</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main id="game">
    <section id="startScreen" class="panel">
      <div class="big-heart">♥</div>
      <p class="subtitle">A SPECIAL ADVENTURE FOR YOU</p>
      <h1>LOVE QUEST</h1>
      <p>Una aventura creada con mucho amor...</p>
      <div class="couple">♡</div>
      <button id="startButton" type="button">START GAME ♥</button>
      <p class="footer">PLAYER 1 · PRESS START</p>
    </section>

    <section id="gameScreen" class="panel" hidden>
      <header class="game-header">
        <strong>LOVE QUEST</strong>
        <span id="memoryCounter">RECUERDOS: 0/4</span>
      </header>

      <p class="instructions">
        Explora el mapa y encuentra vuestros recuerdos.
      </p>

      <canvas id="gameCanvas" width="640" height="480"></canvas>

      <p class="controls-hint">
        Mover: flechas o WASD · Interactuar: E o ESPACIO
      </p>

      <div class="mobile-controls">
        <button type="button" data-move="up">▲</button>
        <div class="horizontal-controls">
          <button type="button" data-move="left">◀</button>
          <button type="button" data-move="down">▼</button>
          <button type="button" data-move="right">▶</button>
        </div>
        <button type="button" id="interactButton" class="interact-button">
          INTERACTUAR ♥
        </button>
      </div>

      <p id="gameMessage">¡Encuentra el limón! 🍋</p>

      <div id="gameWindow">
  <div id="dialogue" class="dialogue" hidden>
    <p id="dialogueTitle"></p>
    <p id="dialogueText"></p>
    <button type="button" id="dialogueButton">CONTINUAR</button>
  </div>
</div>
